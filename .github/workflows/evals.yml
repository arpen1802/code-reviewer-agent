name: evals

# Runs the agent eval suite on PRs to main and pushes to main.
# Notes:
#   - The agent itself calls Gemini, so this workflow needs GEMINI_API_KEY in
#     the repo secrets. Forks won't have access to that secret by default
#     (GitHub's documented behavior), which is fine — for a personal portfolio
#     repo, only owner-authored PRs need to run this.
#   - We skip the LLM-as-judge grader in CI to halve the API cost; the
#     deterministic keyword grader is still strict enough to catch regressions.
#   - Result JSONs are uploaded as a workflow artifact and (for pushes to main)
#     committed back to eval/results/ to maintain a public score history.

on:
  pull_request:
    branches: [main]
    paths:
      - "agent.py"
      - "agents/**"
      - "tools.py"
      - "memory.py"
      - "guardrails.py"
      - "eval/**"
      - "requirements.txt"
      - ".github/workflows/evals.yml"
  push:
    branches: [main]
    paths:
      - "agent.py"
      - "agents/**"
      - "tools.py"
      - "memory.py"
      - "guardrails.py"
      - "eval/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write           # push back the result JSON on main
  pull-requests: write      # comment on the PR with the summary

jobs:
  run-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so the result filename's git-sha makes sense
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run eval suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e
          python eval/run_eval.py --no-llm-judge --save --compare \
            | tee eval-output.log

      - name: Locate the result file
        id: result
        run: |
          # Newest JSON written by --save
          file=$(ls -1t eval/results/*.json | head -n1)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "Result file: $file"

      - name: Build GitHub Step Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          with open(os.environ["RESULT_FILE"]) as f:
              r = json.load(f)
          t = r["totals"]["code"]
          print("## Eval results")
          print()
          print(f"**Prompt version:** `{r['prompt_version']}`  ·  "
                f"**git sha:** `{r['git_sha']}`  ·  "
                f"**tasks:** {r['task_count']}")
          print()
          print(f"**Code grader:** {t['passed']}/{t['total']} passed "
                f"(**{t['pct']}%**)")
          print()
          print("### By category")
          print()
          print("| Category | Passed | Pct |")
          print("|---|---|---|")
          for cat, stats in r["by_category"].items():
              c = stats["code"]
              print(f"| {cat} | {c['passed']}/{c['total']} | {c['pct']}% |")
          print()
          print("### By difficulty")
          print()
          print("| Difficulty | Passed | Pct |")
          print("|---|---|---|")
          for diff, stats in r["by_difficulty"].items():
              c = stats["code"]
              print(f"| {diff} | {c['passed']}/{c['total']} | {c['pct']}% |")
          failed = [t["task_id"] for t in r["tasks"] if not t["code_passed"]]
          if failed:
              print()
              print(f"### Failed ({len(failed)})")
              print()
              for t in r["tasks"]:
                  if not t["code_passed"]:
                      print(f"- `{t['task_id']}` — {t['description']}")
                      print(f"  · reason: {t['code_reason']}")
          PY
        env:
          RESULT_FILE: ${{ steps.result.outputs.file }}

      - name: Upload result JSON as artifact
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: ${{ steps.result.outputs.file }}
          retention-days: 90

      - name: Commit baseline (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/results/
          if git diff --staged --quiet; then
            echo "No new result file to commit."
          else
            git commit -m "eval: baseline ${{ steps.result.outputs.file }}"
            git push
          fi
